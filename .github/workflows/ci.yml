name: EasyVip CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: easyvip-ci
          MYSQL_DATABASE: easyvip
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -peasyvip-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: easyvip-ci
          MARIADB_DATABASE: easyvip
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -peasyvip-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check whitespace
        run: git diff --check
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace --console=plain
        env:
          EASYVIP_TEST_JDBC_URL: 'jdbc:mysql://127.0.0.1:3306/easyvip?sslMode=REQUIRED&allowPublicKeyRetrieval=false'
          EASYVIP_TEST_JDBC_USER: root
          EASYVIP_TEST_JDBC_PASSWORD: easyvip-ci
          EASYVIP_TEST_REDIS_URI: redis://127.0.0.1:6379
      - name: MariaDB concurrency tests
        run: ./gradlew test --no-daemon --rerun-tasks --tests br.com.pedrodalben.easyvip.persistence.SqlConcurrencyTest --stacktrace --console=plain
        env:
          EASYVIP_TEST_JDBC_URL: 'jdbc:mysql://127.0.0.1:3307/easyvip?sslMode=REQUIRED&allowPublicKeyRetrieval=false'
          EASYVIP_TEST_JDBC_USER: root
          EASYVIP_TEST_JDBC_PASSWORD: easyvip-ci

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
