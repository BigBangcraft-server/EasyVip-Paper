plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'br.com.pedrodalben'
version = '1.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    velocity {
        java.setSrcDirs(['src/velocity/java'])
        resources.setSrcDirs(['src/velocity/resources'])
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "luckperms"
        url = "https://repo.luckperms.net/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.121-stable'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'redis.clients:jedis:7.1.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    velocityCompileOnly 'com.velocitypowered:velocity-api:4.1.1-SNAPSHOT'
    velocityAnnotationProcessor 'com.velocitypowered:velocity-api:4.1.1-SNAPSHOT'

    testImplementation 'io.papermc.paper:paper-api:26.2.build.121-stable'
    testImplementation 'net.luckperms:api:5.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'com.h2database:h2:2.2.224'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching(['paper-plugin.yml', 'plugin.yml']) {
        expand props
    }
}

tasks.named('processVelocityResources') {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('velocity-plugin.json') {
        expand props
    }
}

tasks.named('compileVelocityJava') {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('')
}

tasks.register('velocityJar', Jar) {
    dependsOn tasks.named('jar'), tasks.named('shadowJar'), tasks.named('velocityClasses')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'EasyVip-Velocity'
    archiveVersion = project.version
    from({ zipTree(tasks.named('shadowJar').get().archiveFile) }) {
        exclude 'plugin.yml', 'paper-plugin.yml'
        exclude 'br/com/pedrodalben/easyvip/paper/**'
        exclude 'br/com/pedrodalben/easyvip/command/**'
        exclude 'br/com/pedrodalben/easyvip/listener/**'
        exclude 'br/com/pedrodalben/easyvip/event/**'
        exclude 'br/com/pedrodalben/easyvip/action/**'
        exclude 'br/com/pedrodalben/easyvip/platform/**'
        exclude 'br/com/pedrodalben/easyvip/service/**'
        exclude 'br/com/pedrodalben/easyvip/network/NetworkEventListener*'
        exclude 'br/com/pedrodalben/easyvip/webstore/WebStoreSyncService*'
        exclude 'br/com/pedrodalben/easyvip/webstore/WebStoreFulfillmentService*'
    }
    from(sourceSets.velocity.output)
}

build.dependsOn shadowJar, velocityJar
